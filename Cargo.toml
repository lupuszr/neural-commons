[workspace]
members = ["crates/core", "crates/evaluator", "crates/dkg-client", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
safetensors = "=0.8.0"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
rusqlite = { version = "0.38", features = ["bundled"] }
nc-core = { path = "crates/core" }
nc-evaluator = { path = "crates/evaluator" }
nc-dkg-client = { path = "crates/dkg-client" }

# Keep streaming integrity checks practical in development and test binaries.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
